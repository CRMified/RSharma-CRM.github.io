
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Legrand Test</title>
  <meta name="description" content="Legrand Test" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f9fb;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#7c3aed; /* purple */
      --accent-2:#06b6d4; /* teal */
      --glass: rgba(255,255,255,0.7);
      --radius:14px;
      --max:1100px;
      --shadow: 0 8px 30px rgba(16,24,40,0.08);
      --safe-contrast: #0f172a;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
	  
    html,body{height:100%;}
    body{
      margin:0;
      background: linear-gradient(180deg, #f2f6fb 0%, var(--bg) 100%);
      color:var(--safe-contrast);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.5;
    }
    .container{
      max-width:var(--max);
      margin:0 auto;
      padding:28px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:12px 0;
    }
    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      text-decoration:none;
      color:inherit;
    }
    .logo{
      width:48px;height:48px;border-radius:10px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff;font-weight:700;font-size:18px;
      box-shadow:var(--shadow);
    }
    nav{display:flex;gap:16px;align-items:center;}
    nav a{
      color:var(--muted); text-decoration:none; font-weight:600;
    }
    .cta{
      background:var(--accent); color:#fff; border:none; padding:10px 14px; border-radius:10px; font-weight:700; cursor:pointer;
      box-shadow:0 6px 18px rgba(124,58,237,0.18);
    }
    /* Hero */
    .hero{
      background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));
      border-radius:20px; padding:36px; margin:20px 0; display:grid; grid-template-columns: 1fr 380px; gap:28px; align-items:center;
      box-shadow:var(--shadow);
    }
    .eyebrow{display:inline-block;background:rgba(124,58,237,0.08); color:var(--accent); padding:6px 10px;border-radius:999px;font-weight:700;font-size:13px;}
    h1{margin:8px 0 12px;font-size:28px;line-height:1.05;}
    p.lead{margin:0;color:var(--muted);font-size:16px;}
    .hero-actions{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;}
    .btn-ghost{background:transparent;border:2px solid rgba(15,23,42,0.06);padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;}
    .stats{display:flex;gap:18px;margin-top:22px;}
    .stat{background:rgba(15,23,42,0.03); padding:12px;border-radius:10px;min-width:110px;text-align:center;}
    .hero-card{background:linear-gradient(180deg,#ffffff,#faf8ff); border-radius:14px;padding:18px;box-shadow:0 6px 16px rgba(16,24,40,0.06);}
    .hero-card h3{margin:0 0 8px;font-size:16px;}
    .hero-card p{margin:0;color:var(--muted);font-size:14px;}
    /* Sections */
    section{margin:28px 0;}
    .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
    .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:var(--shadow);}
    .card h4{margin:0 0 8px;}
    .muted{color:var(--muted);font-size:14px;}
    /* Events */
    .events-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
    .event{border-radius:12px;padding:14px;background:linear-gradient(180deg,#fff,#fbfbff);border:1px solid rgba(10,10,12,0.02);}
    .event time{display:inline-block;font-weight:700;color:var(--accent);margin-bottom:8px;}
    /* About / Get involved */
    .two-col{display:grid;grid-template-columns:1fr 360px;gap:22px;align-items:start;}
    .donate{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff;padding:18px;border-radius:12px;font-weight:700;text-align:center;}
    /* Footer */
    footer{margin-top:32px;padding-top:22px;border-top:1px solid rgba(10,10,12,0.04);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}
    /* Responsive */
    @media (max-width:920px){
      .hero{grid-template-columns:1fr; padding:20px;}
      .two-col{grid-template-columns:1fr;}
      header{flex-direction:column;align-items:flex-start;gap:12px;}
      nav{order:2;width:100%;display:flex;justify-content:space-between;}
    }
    /* small utilities */
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(6,182,212,0.08);color:var(--accent-2);font-weight:700;font-size:13px}
    .footer-links{display:flex;gap:12px;flex-wrap:wrap;}
    input,textarea,select{font:inherit;padding:10px;border-radius:8px;border:1px solid rgba(10,10,12,0.06);width:100%;}
    .form-row{display:grid;gap:10px;margin-bottom:12px;}
    .small{font-size:13px;color:var(--muted);}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  </style>
</head>
